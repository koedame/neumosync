name: 'build-mac-intel'

on:
  workflow_dispatch:

jobs:
  build-mac-intel:
    # intel cpuはmacos-13まで
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: build tauri app
        run: bun run tauri build

      # result
      # src-tauri/target/release/bundle/dmg/tauri-app_0.0.0_x64.dmg
      # src-tauri/target/release/bundle/macos/tauri-app.app
      - name: upload tauri app build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-app-build
          path: src-tauri/target/release/bundle/*
