name: 'build-mac-intel'

on:
  workflow_dispatch:

jobs:
  build-mac-intel:
    # intel cpuはmacos-13まで
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.4.3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: build tauri app
        run: bun run tauri build

      # result
      # src-tauri/target/release/bundle/dmg/tauri-app_0.0.0_x64.dmg
      # src-tauri/target/release/bundle/macos/tauri-app.app
      - name: upload tauri app build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-app-build
          path: src-tauri/target/release/bundle/*
