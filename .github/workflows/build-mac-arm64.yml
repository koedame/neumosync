name: 'build-mac-arm'

on:
  workflow_dispatch:

jobs:
  build-mac-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: 1.4.3

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install

      - name: build tauri app
        run: bun run tauri build

      # result
      # src-tauri/target/release/bundle/dmg/tauri-app_0.0.0_x64.dmg
      # src-tauri/target/release/bundle/macos/tauri-app.app
      - name: upload tauri app build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-app-build
          path: src-tauri/target/release/bundle/*
